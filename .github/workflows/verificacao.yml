name: Verificação do Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
     - name: Baixar o código
       uses: actions/checkout@v4
  
     - name: Verificar página
       run: test -f index.html
  
     - name: Verificar atualização
       run: |
         if grep -q "Última atualização" index.html; then
          echo "✓ A página possui a informação de atualização."
          echo "✓ Pull Request validado com sucesso!"
         else
          echo "✗ A informação de atualização não foi encontrada."
          exit 1
         fi
